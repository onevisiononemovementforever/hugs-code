name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prerender pages to static HTML
        run: bun scripts/prerender.mjs

      - name: Prepare static output
        run: |
          cp -r dist/client _site
          test -f _site/index.html || (echo "index.html missing" && exit 1)
          # SPA-style fallback so deep links don't 404 on Pages
          cp _site/index.html _site/404.html
          # Disable Jekyll processing
          touch _site/.nojekyll
          # GitHub Pages requires the CNAME file at the root of the artifact
          if [ -f public/CNAME ]; then cp public/CNAME _site/CNAME; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
