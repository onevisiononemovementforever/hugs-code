name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare static output
        run: |
          # Nitro/TanStack Start places static assets in .output/public.
          # Fall back to dist/client or dist if the layout differs.
          if [ -d .output/public ]; then
            cp -r .output/public _site
          elif [ -d dist/client ]; then
            cp -r dist/client _site
          else
            cp -r dist _site
          fi
          # SPA-style fallback so deep links don't 404 on Pages
          cp _site/index.html _site/404.html 2>/dev/null || true

          # GitHub Pages requires the CNAME file at the root of the artifact
          if [ -f public/CNAME ]; then cp public/CNAME _site/CNAME; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
